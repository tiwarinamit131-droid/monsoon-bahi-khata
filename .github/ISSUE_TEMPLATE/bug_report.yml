name: Bug report
description: Something looks wrong or doesn't work
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect, and what did you see instead?
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link to the state
      description: Press C on the page to copy a deep link, then paste it here.
      placeholder: https://…/?state=BR
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open Gujarat
        2. Drag October rain to +40%
        3. …
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 140 on Windows 11
  - type: textarea
    id: hud
    attributes:
      label: Developer HUD
      description: Press D and paste or screenshot what it shows, if it is a performance issue.
