name: Idea
description: Suggest a feature, a chart or a better model
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: dropdown
    id: pillar
    attributes:
      label: Which part?
      options: [Descriptive, Diagnostic, Predictive, Prescriptive, Engine, Developer experience, Other]
  - type: textarea
    id: why
    attributes:
      label: Why does it matter?
